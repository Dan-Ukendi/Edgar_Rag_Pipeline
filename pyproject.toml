[project]
name = "tenk-rag"
version = "0.1.0"
description = "Benchmarked RAG pipeline for SEC 10-K filings"
readme = "README.md"
authors = [
    { name = "Dan-Ukendi", email = "ukendidan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
tenk-rag = "tenk_rag:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
