[project]
name = "tenk-rag"
version = "0.1.0"
description = "Benchmarked RAG pipeline for SEC 10-K filings"
readme = "README.md"
authors = [
    { name = "Dan-Ukendi", email = "ukendidan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
tenk-rag = "tenk_rag:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
