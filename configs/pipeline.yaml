raw_data_dir: data/raw

chunking:
  chunk_size: 1000
  chunk_overlap: 150

embedding:
  backend: local
  model_name: BAAI/bge-small-en-v1.5
  batch_size: 32

vector_store:
  backend: qdrant
  collection_name: tenk_filings
  mode: server
  url: http://localhost:6333
  local_path: data/processed/qdrant_local

llm:
  backend: groq   # or "local"
  groq:
    model: openai/gpt-oss-120b
    max_tokens: 2048
  local:
    model: llama3.2:3b
    base_url: http://localhost:11434
    max_tokens: 2048

retrieval:
  top_k: 5
  top_k_per_company: 2
