services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/11434"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/ollama", "pull", "llama3.2:3b"]
    restart: "no"

  ingest:
    build: .
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    environment:
      QDRANT_URL: http://qdrant:6333
    command: ["python", "scripts/docker_ingest.py"]
    restart: "no"

  api:
    build: .
    depends_on:
      qdrant:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
    command: ["uvicorn", "tenk_rag.api.app:app", "--host", "0.0.0.0", "--port", "8000"]

  ui:
    build: .
    depends_on:
      - api
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    command: ["streamlit", "run", "ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]

volumes:
  qdrant_storage:
  ollama_data:
